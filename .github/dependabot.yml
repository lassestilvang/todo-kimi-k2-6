# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 10
    # Security updates are enabled by default - PRs for high/critical vulns
    groups:
      # Group major version updates for testing
      production-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Separate group for dev dependencies
      development-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    reviewers:
      - 'lasse'
    labels:
      - 'dependencies'
      - 'automated-pr'
    # Automatically merge non-breaking security updates
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    labels:
      - 'github-actions'
      - 'dependencies'
      - 'automated-pr'

  # Docker (if used)
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'docker'
      - 'dependencies'
      - 'automated-pr'
